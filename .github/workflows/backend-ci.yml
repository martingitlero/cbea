# Source-code CI — the .NET Functions project. Paired with infra-ci.yml (Bicep).
# No `paths:` filter and no deploy job, both deliberate; README section 5 has the reasoning.
name: backend-ci

on:
  push:
    branches:
      - develop
      - 'release/**'
  pull_request:
    branches:
      - develop
      - 'release/**'
  workflow_dispatch:

# Least privilege: these jobs only ever read the repo.
permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  SOLUTION: GameBackend.sln
  FUNCTION_PROJECT: src/GameBackend/GameBackend.csproj

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore

      - name: Test
        run: |
          dotnet test ${{ env.SOLUTION }} \
            -c Release \
            --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory ./TestResults

      - name: Upload test results
        # Upload even when tests fail - the .trx is how you triage the failure.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults/**
          retention-days: 14
          if-no-files-found: warn

  package:
    name: Package artifact
    # Only build-and-test: a GitHub job cannot depend on a job in another
    # workflow, so the Bicep gate lives entirely in infra-ci.yml. Branch
    # protection is what makes BOTH workflows green before a merge - see
    # README section 5.
    needs: [build-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish
        run: dotnet publish ${{ env.FUNCTION_PROJECT }} -c Release -o ./publish

      - name: Zip publish output
        # Zip from inside ./publish so host.json sits at the archive root, which
        # is what the Functions zip-deploy / run-from-package expects.
        run: |
          cd ./publish
          zip -r ../GameBackend.zip .

      - name: Upload function package
        uses: actions/upload-artifact@v4
        with:
          name: function-package
          path: GameBackend.zip
          retention-days: 30
          if-no-files-found: error
